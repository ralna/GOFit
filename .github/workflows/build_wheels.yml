name: Build and upload to PyPI

# Build on every pull request change and publish when a (published) GitHub Release is created:
on:
  pull_request:
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Note: builds on these are backward compatible
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        # to supply options, put them in 'env', like:
        # env:
        #   CIBW_SOME_OPTION: value
        env:
          # List of platforms to build on
          CIBW_BUILD: cp3{10,11,12,13,14}-manylinux_x86_64 cp3{10,11,12,13,14}-macosx_x86_64 cp3{10,11,12,13,14}-macosx_arm64 cp3{10,11,12,13,14}-win_amd64

          # Install Eigen and pybind11 on manylinux images (no brew, need Eigen >= 3.4)
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y wget &&
            wget https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz &&
            tar xzf eigen-5.0.1.tar.gz &&
            cd eigen-5.0.1 &&
            mkdir build &&
            cd build &&
            cmake .. &&
            make install &&
            cd ../..
          CIBW_BEFORE_BUILD_LINUX: pip install pybind11[global]

          # Install Eigen and pybind11 on macOS
          CIBW_BEFORE_ALL_MACOS: brew install eigen pybind11
          CIBW_ENVIRONMENT_MACOS: "CPLUS_INCLUDE_PATH='/opt/homebrew/include/eigen3:/usr/local/include/eigen3'"

          # Install Eigen and pybind11 on Windows images (no brew, need Eigen >= 3.4)
          CIBW_BEFORE_ALL_WINDOWS: |
            powershell -Command "Invoke-WebRequest -Uri https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.zip -OutFile eigen.zip; Expand-Archive eigen.zip -DestinationPath .; cmake -S eigen-5.0.1 -B eigen-build -DCMAKE_INSTALL_PREFIX=./eigen-install -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF -DBUILD_TESTING=OFF; cmake --install eigen-build"
          CIBW_ENVIRONMENT_WINDOWS: 'CMAKE_PREFIX_PATH="eigen-install"'
          CIBW_BEFORE_BUILD_WINDOWS: pip install pybind11[global] delvewheel

          # cibuildwheel doesn't yet ship a default repair command for Windows
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"

          # Install test dependencies and run tests
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {project}/tests/test_multistart.py

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
          # To test: repository_url: https://test.pypi.org/legacy/
